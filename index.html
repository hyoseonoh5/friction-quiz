const GAS_URL = "https://script.google.com/macros/s/AKfycbyKSfGX5SBSC-ZVb4xFeOK1ni16zto58dYigOqk8_zJx5sjDl85teGqr2dgYTxin2ycUQ/exec";

// ── API 헬퍼 ──────────────────────────────────────────────────────
async function gasGet(params) {
  const url = GAS_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function gasPost(body) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ── CanvasPanel ───────────────────────────────────────────────────
const CanvasPanel = forwardRef(function CanvasPanel({ accentColor, bgColor, watermark }, ref) {
  const canvasRef = useRef(null);
  const [drawing,setDrawing]=useState(false);
  const [color,setColor]=useState("#ffffff");
  const [lineWidth,setLineWidth]=useState(3);
  const [tool,setTool]=useState("pen");
  const [textVal,setTextVal]=useState("");
  const lastPos=useRef(null);
  const COLORS=["#ffffff","#e74c3c","#e67e22","#f1c40f","#2ecc71","#3498db","#9b59b6","#1abc9c","#000000"];

  const initCanvas=useCallback(()=>{
    const c=canvasRef.current; if(!c) return;
    const ctx=c.getContext("2d");
    ctx.fillStyle=bgColor; ctx.fillRect(0,0,c.width,c.height);
    ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
    for(let y=40;y<c.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}
    ctx.font="bold 14px 'Noto Sans KR',sans-serif";
    ctx.fillStyle="rgba(255,255,255,0.1)"; ctx.fillText(watermark,10,22);
  },[bgColor,watermark]);

  useEffect(()=>{initCanvas();},[initCanvas]);
  useEffect(()=>{ if(ref) ref.current={toDataURL:()=>canvasRef.current?.toDataURL("image/png")??""} },[ref]);

  const getPos=(e,c)=>{
    const r=c.getBoundingClientRect();
    const sx=c.width/r.width, sy=c.height/r.height;
    const s=e.touches?e.touches[0]:e;
    return {x:(s.clientX-r.left)*sx, y:(s.clientY-r.top)*sy};
  };
  const startDraw=useCallback((e)=>{
    e.preventDefault(); if(tool==="text") return;
    setDrawing(true);
    const pos=getPos(e,canvasRef.current); lastPos.current=pos;
    const ctx=canvasRef.current.getContext("2d");
    ctx.beginPath(); ctx.arc(pos.x,pos.y,(tool==="eraser"?12:lineWidth)/2,0,Math.PI*2);
    ctx.fillStyle=tool==="eraser"?bgColor:color; ctx.fill();
  },[tool,color,lineWidth,bgColor]);
  const draw=useCallback((e)=>{
    e.preventDefault(); if(!drawing) return;
    const c=canvasRef.current; const ctx=c.getContext("2d");
    const pos=getPos(e,c);
    ctx.beginPath(); ctx.moveTo(lastPos.current.x,lastPos.current.y); ctx.lineTo(pos.x,pos.y);
    ctx.strokeStyle=tool==="eraser"?bgColor:color;
    ctx.lineWidth=tool==="eraser"?24:lineWidth; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke();
    lastPos.current=pos;
  },[drawing,color,lineWidth,tool,bgColor]);
  const endDraw=useCallback(()=>setDrawing(false),[]);
  const addText=(e)=>{
    if(tool!=="text"||!textVal.trim()) return;
    const c=canvasRef.current; const ctx=c.getContext("2d");
    const r=c.getBoundingClientRect();
    ctx.font=`${lineWidth*5+10}px 'Noto Sans KR',sans-serif`; ctx.fillStyle=color;
    ctx.fillText(textVal,(e.clientX-r.left)*(c.width/r.width),(e.clientY-r.top)*(c.height/r.height));
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",
        background:"rgba(255,255,255,0.04)",padding:"8px 10px",borderRadius:10,
        border:`1px solid ${accentColor}33`}}>
        <div style={{display:"flex",gap:4}}>
          {[["pen","✏️ 펜"],["eraser","🧹 지우개"],["text","✍️ 텍스트"]].map(([t,label])=>(
            <button key={t} onClick={()=>setTool(t)}
              style={{padding:"5px 10px",borderRadius:7,border:"none",cursor:"pointer",
                fontFamily:"inherit",fontSize:12,
                background:tool===t?accentColor:"rgba(255,255,255,0.08)",color:"#fff",transition:"all .15s"}}>
              {label}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:3}}>
          {COLORS.map(c=>(
            <div key={c} onClick={()=>{setColor(c);if(tool==="eraser")setTool("pen");}}
              style={{width:20,height:20,borderRadius:"50%",background:c,cursor:"pointer",
                border:color===c?"2.5px solid #fff":"1.5px solid rgba(255,255,255,0.15)",transition:"all .15s"}}/>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{color:"#aaa",fontSize:11}}>굵기</span>
          <input type="range" min={1} max={10} value={lineWidth}
            onChange={e=>setLineWidth(+e.target.value)} style={{width:60}}/>
        </div>
        {tool==="text"&&(
          <input value={textVal} onChange={e=>setTextVal(e.target.value)}
            placeholder="텍스트 입력 후 캔버스 클릭"
            style={{padding:"4px 8px",borderRadius:6,border:"1px solid rgba(255,255,255,0.15)",
              background:"rgba(255,255,255,0.08)",color:"#fff",fontFamily:"inherit",fontSize:12,width:160}}/>
        )}
        <button onClick={initCanvas}
          style={{padding:"5px 10px",borderRadius:7,border:"none",cursor:"pointer",
            background:"rgba(255,255,255,0.06)",color:"#ccc",fontFamily:"inherit",fontSize:12}}>
          🗑️ 지우기
        </button>
      </div>
      <canvas ref={canvasRef} width={640} height={420}
        style={{width:"100%",borderRadius:10,touchAction:"none",
          border:`1.5px solid ${accentColor}55`,cursor:tool==="text"?"text":"crosshair"}}
        onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw}
        onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw} onClick={addText}/>
    </div>
  );
});

          background:"linear-gradient(135deg,#e74c3c,#c0392b)",color:"#fff",
          fontFamily:"inherit",fontSize:15,fontWeight:700,boxShadow:"0 4px 20px rgba(231,76,60,.4)"}}>
        📤 두 캔버스 모두 제출하기
      </button>
    </div>
  );
}

// ── LeaderboardMini ───────────────────────────────────────────────
function LeaderboardMini({ scores, myClass, myKey }) {
  const classScores=scores.filter(s=>String(s.classNum)===String(myClass));
  const ranked=[...classScores].sort((a,b)=>b.total-a.total||(a.ts||0)-(b.ts||0));
  if(ranked.length===0) return null;
  return (
    <div style={{marginTop:16,background:"rgba(255,255,255,0.03)",borderRadius:12,padding:16,
      border:"1px solid rgba(255,255,255,0.07)"}}>
      <div style={{color:"#aaa",fontSize:13,marginBottom:10}}>🏆 {myClass}반 현재 순위</div>
      {ranked.slice(0,5).map((s,i)=>(
        <div key={s.key} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",
          borderBottom:"1px solid rgba(255,255,255,0.04)",
          color:s.key===myKey?"#f1c40f":"#ccc",fontWeight:s.key===myKey?700:400}}>
          <span>{i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}위`} {s.num}모둠 {s.name}{s.key===myKey?" (나)":""}</span>
          <span>{s.total}점</span>
        </div>
      ))}
    </div>
  );
}

          border:"1px solid rgba(255,255,255,0.08)",padding:16}}>

            <div style={{color:"#e74c3c",fontWeight:700,fontSize:15}}>
              {s.classNum}반 {s.num}모둠 {s.name}
              <span style={{color:"#555",fontWeight:400,fontSize:12,marginLeft:10}}>

                  style={{padding:"4px 10px",borderRadius:6,border:"1px solid rgba(255,255,255,0.15)",
                    cursor:"pointer",background:"rgba(255,255,255,0.06)",color:"#aaa",fontFamily:"inherit",fontSize:12}}>취소</button>
              </div>
            ):(
              <button onClick={()=>setConfirmKey(s.key)}

  // ── Q1 저장 ──────────────────────────────────────────────────────
  const saveQ1=useCallback(async(imgs)=>{
    setQ1Saving(true);
    const rec={key:studentKey,classNum,num:groupNum,name:stuName,
      slope:imgs.slope,flat:imgs.flat,ts:Date.now()};
    if(gasConfigured){
      try{ await gasPost({action:"saveQ1",...rec}); }catch{}
    } else {
      const prev=lsGet("friction_q1_v2");
      const idx=prev.findIndex(r=>r.key===studentKey);
      if(idx>=0) prev[idx]=rec; else prev.push(rec);
      lsSet("friction_q1_v2",prev);
    }
    setQ1Images(imgs); setQ1Submitted(true); setQ1Saving(false);
  },[studentKey,classNum,groupNum,stuName,gasConfigured]);

  // ── Score 저장 ────────────────────────────────────────────────────
  const saveScore=useCallback(async(q2s,q3s)=>{
    setQ3Saving(true);
    const rec={key:studentKey,classNum,num:groupNum,name:stuName,
      q2s,q3s,total:q2s+q3s,ts:Date.now()};
    if(gasConfigured){
      try{ await gasPost({action:"saveScore",...rec}); }catch{}
    } else {
      const prev=lsGet("friction_scores_v2");
      const idx=prev.findIndex(r=>r.key===studentKey);
      if(idx>=0) prev[idx]=rec; else prev.push(rec);
      lsSet("friction_scores_v2",prev);
    }
    setQ3Saving(false);
  },[studentKey,classNum,groupNum,stuName,gasConfigured]);

  // ── 삭제 ─────────────────────────────────────────────────────────
  const deleteAll=useCallback(async(key)=>{
    if(gasConfigured){
      try{ await gasPost({action:"deleteAll",key}); }catch{}
    } else {
      lsSet("friction_q1_v2", lsGet("friction_q1_v2").filter(r=>r.key!==key));
      lsSet("friction_scores_v2", lsGet("friction_scores_v2").filter(r=>r.key!==key));
    }
    setAllData(d=>({
      submissions:d.submissions.filter(r=>r.key!==key),
      scores:d.scores.filter(r=>r.key!==key),
    }));
  },[gasConfigured]);

  // ── Q2/Q3 체크 ───────────────────────────────────────────────────
  const checkQ2=()=>{
    const results=Q2_ITEMS.map((item,i)=>checkQ2Answer(item,q2Inputs[i]));
    setQ2Results(results); setQ2Score(results.filter(Boolean).length*25); setQ2Done(true);
  };
  const checkQ3=async()=>{
    const results=Q3_QUESTIONS.map((item,i)=>checkQ3Answer(item,q3Inputs[i]));
    const score=results.filter(Boolean).length*33;
    setQ3Results(results); setQ3Score(score); setQ3Done(true);
    await saveScore(q2Score, score);
  };

  // ── 교사 로그인/비번 ─────────────────────────────────────────────
  const handleTeacherLogin=()=>{
    if(teacherPass===savedPass){setTeacherAuth(true);setLoginError("");}
    else setLoginError("비밀번호가 올바르지 않습니다.");
  };
  const handleChangePass=()=>{
    if(!newPw1||newPw1.length<4){setPwMsg("4자리 이상 입력해주세요.");return;}
    if(newPw1!==newPw2){setPwMsg("두 비밀번호가 일치하지 않습니다.");return;}
    try{localStorage.setItem("teacher_pass",newPw1);}catch{}
    setSavedPass(newPw1); setNewPw1(""); setNewPw2("");
    setPwMsg("✅ 비밀번호가 변경되었습니다.");
    setTimeout(()=>{setShowChangePw(false);setPwMsg("");},1500);
  };

  // ── 학생 시작 (중복 체크) ─────────────────────────────────────────
  const handleStart=async()=>{
    if(!classNum){setNameError("반을 선택해주세요.");return;}
    if(!groupNum){setNameError("모둠을 선택해주세요.");return;}
    if(!stuName1.trim()){setNameError("이름(1)을 입력해주세요.");return;}
    setChecking(true); setNameError("");
    try{
      if(gasConfigured){
        const r=await gasGet({action:"checkDup",classNum,num:groupNum});
        if(r.ok&&r.dup){
          setNameError(`${classNum}반 ${groupNum}모둠은 이미 제출되었습니다. 교사에게 문의하세요.`);
          setChecking(false); return;
        }
      } else {
        const scores=lsGet("friction_scores_v2");
        const subs=lsGet("friction_q1_v2");
        if(scores.find(r=>String(r.classNum)===String(classNum)&&String(r.num)===String(groupNum))
          ||subs.find(r=>String(r.classNum)===String(classNum)&&String(r.num)===String(groupNum))){
          setNameError(`${classNum}반 ${groupNum}모둠은 이미 제출되었습니다. 교사에게 문의하세요.`);
          setChecking(false); return;
        }
      }
    }catch{}
    setChecking(false); setMode("student");
  };

  const getRanked=scores=>[...scores].sort((a,b)=>b.total-a.total||(a.ts||0)-(b.ts||0)).map((s,i)=>({...s,rank:i+1}));

  // ═══════════════════ HOME ════════════════════════════════════════
  if(mode==="home") return (
    <div style={S.bg}>
      <div style={S.homeCard}>
        <div style={S.badge}>⚗️ 과학 탐구 퀴즈</div>

        <p style={S.homeSub}>중학교 1학년 · 실험 마무리 퀴즈</p>

        {/* GAS 미설정 경고 */}
        {!gasConfigured&&(

              <input value={stuName2} onChange={e=>setStuName2(e.target.value)}

  // ═══════════════════ TEACHER DASHBOARD ═══════════════════════════
  if(mode==="teacher"&&teacherAuth){

              <button onClick={()=>{setShowChangePw(v=>!v);setPwMsg("");setNewPw1("");setNewPw2("");}}
                style={{...S.btnSmall,background:"rgba(255,255,255,0.07)",color:"#ccc"}}>🔑 비번변경</button>
              <button onClick={()=>{setMode("home");setTeacherAuth(false);}}
                style={{...S.btnSmall,background:"rgba(255,255,255,0.05)",color:"#aaa"}}>나가기</button>
            </div>
          </div>

          {/* GAS 상태 */}
          {!gasConfigured&&(
            <div style={{padding:"10px 14px",borderRadius:10,marginBottom:16,

              color:"#f1c40f",fontSize:13}}>
              ⚠️ Google Sheets 미연동 상태 — 이 기기 데이터만 표시됩니다.

          {gasConfigured&&(
            <div style={{padding:"8px 14px",borderRadius:10,marginBottom:16,

          {/* 비번 변경 패널 */}
          {showChangePw&&(
            <div style={{background:"rgba(255,255,255,0.05)",borderRadius:14,
              border:"1px solid rgba(255,255,255,0.1)",padding:20,marginBottom:20}}>
              <div style={{color:"#fff",fontWeight:700,marginBottom:14}}>🔑 비밀번호 변경</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                <div>
                  <div style={{color:"#aaa",fontSize:12,marginBottom:4}}>새 비밀번호</div>
                  <input type="password" value={newPw1} onChange={e=>setNewPw1(e.target.value)}
                    placeholder="새 비밀번호 (4자 이상)"
                    style={{...S.input,background:"#fff",color:"#111",borderColor:"rgba(0,0,0,0.2)"}}/>
                </div>
                <div>
                  <div style={{color:"#aaa",fontSize:12,marginBottom:4}}>비밀번호 확인</div>
                  <input type="password" value={newPw2} onChange={e=>setNewPw2(e.target.value)}

                    style={{...S.input,background:"#fff",color:"#111",borderColor:"rgba(0,0,0,0.2)"}}
                    onKeyDown={e=>{if(e.key==="Enter") handleChangePass();}}/>
                </div>
              </div>
              {pwMsg&&(
                <div style={{fontSize:13,marginBottom:10,padding:"7px 12px",borderRadius:8,
                  color:pwMsg.startsWith("✅")?"#2ecc71":"#e74c3c",
                  background:pwMsg.startsWith("✅")?"rgba(46,204,113,0.1)":"rgba(231,76,60,0.1)",
                  border:`1px solid ${pwMsg.startsWith("✅")?"rgba(46,204,113,0.3)":"rgba(231,76,60,0.25)"}`}}>
                  {pwMsg}
                </div>
              )}
              <div style={{display:"flex",gap:8}}>
                <button onClick={handleChangePass}
                  style={{...S.btnSmall,background:"linear-gradient(135deg,#e74c3c,#c0392b)",color:"#fff",padding:"8px 20px"}}>

                <button onClick={()=>{setShowChangePw(false);setPwMsg("");}}

          {/* 반 필터 */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
            {classOptions.map(c=>(
              <button key={c} onClick={()=>setFilterClass(c)}
                style={{padding:"6px 14px",borderRadius:8,border:"none",cursor:"pointer",
                  fontFamily:"inherit",fontSize:13,transition:"all .15s",
                  background:filterClass===c?"#e74c3c":"rgba(255,255,255,0.07)",color:"#fff"}}>

              </button>

          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            {[["q1","📝 Q1 답안"],["q2q3","🏆 점수 & 순위"]].map(([k,label])=>(
              <button key={k} onClick={()=>setDashTab(k)}
                style={{padding:"8px 20px",borderRadius:10,border:"none",cursor:"pointer",
                  fontFamily:"inherit",fontSize:14,
                  background:dashTab===k?"#e74c3c":"rgba(255,255,255,0.08)",color:"#fff"}}>
                {label}
              </button>
            ))}
          </div>

          {loading&&<div style={{color:"#aaa",textAlign:"center",padding:20}}>⏳ 불러오는 중...</div>}

          {!loading&&dashTab==="q1"&&(
            <div>
              <h3 style={{color:"#e74c3c",marginBottom:16}}>Q1 답안 ({filteredSubs.length}명 제출)</h3>
              {filteredSubs.length===0
                ?<div style={S.emptyBox}>아직 제출된 답안이 없습니다</div>
                :<Q1CardList subs={filteredSubs} onDelete={deleteAll}/>}
            </div>

          {!loading&&dashTab==="q2q3"&&(
            <div>
              <h3 style={{color:"#4ECDC4",marginBottom:16}}>
                🏆 {filterClass==="all"?"전체":filterClass+"반"} 순위 ({ranked.length}명)
              </h3>
              {ranked.length===0
                ?<div style={S.emptyBox}>아직 제출된 점수가 없습니다</div>
                :<RankCardList ranked={ranked} onDelete={deleteAll}/>}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ═══════════════════ STUDENT QUIZ ════════════════════════════════
  const progress=((currentQ-1)/3)*100;
  return (
    <div style={S.bg}>
      <div style={{maxWidth:760,margin:"0 auto",padding:"20px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div>
            <div style={S.badge}>⚗️ 마찰력 &amp; 탐구과정</div>
            <div style={{color:"#888",fontSize:13,marginTop:3}}>👤 {classNum}반 {groupNum}모둠 {stuName}</div>

          <div style={S.qCard}>

            <p style={{color:"#888",fontSize:13,marginBottom:16,lineHeight:1.6}}>

            </p>
            {!q1Submitted
              ?<DualCanvas onSave={async imgs=>{await saveQ1(imgs);}}/>

                  {q1Saving?<div style={{color:"#aaa",marginBottom:12}}>⏳ 저장 중...</div>

                      color:"#111111",borderColor:q2Done?(q2Results[i]?"#2ecc71":"#e74c3c"):"rgba(0,0,0,0.25)"}}/>
                  {q2Done&&(
                    <div style={{marginTop:6,fontSize:13,color:q2Results[i]?"#2ecc71":"#e74c3c"}}>
                      {q2Results[i]?"✅ 정답!":`❌ 정답: ${item.display}`}
                    </div>
                  )}
                </div>
              ))}
            </div>
            {!q2Done
              ?<button onClick={checkQ2} style={{...S.btn,marginTop:20}}>✅ 제출하기</button>
              :(
                <div style={{marginTop:20}}>
                  <div style={{...S.scoreBox,borderColor:"#4ECDC4"}}>
                    <div style={{color:"#4ECDC4",fontSize:36,fontWeight:900}}>{q2Score}점</div>
                    <div style={{color:"#aaa",fontSize:14,marginTop:4}}>
                      {q2Score===100?"🎉 만점!":q2Score===0?"다시 확인해보세요":`${q2Score/25}개 정답`}
                    </div>
                  </div>
                  <button onClick={()=>setCurrentQ(3)} style={{...S.btn,marginTop:14}}>다음 문제 →</button>
                </div>
              )}
          </div>
        )}

        {/* Q3 */}
        {currentQ===3&&(
          <div style={S.qCard}>
            <div style={S.qNum}>Q3</div>
            <h2 style={S.qTitle}>변인의 종류 — 단답형</h2>
            <p style={{color:"#888",fontSize:13,marginBottom:18}}>각 설명에 해당하는 변인의 이름을 쓰세요.</p>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {Q3_QUESTIONS.map((item,i)=>(
                <div key={i} style={S.infoBox}>
                  <div style={{color:"#f1c40f",fontWeight:700,fontSize:14,marginBottom:8}}>문제 {i+1}</div>
                  <p style={{color:"#ddd",fontSize:14,lineHeight:1.7,marginBottom:10}}>{item.q}</p>
                  <input value={q3Inputs[i]}
                    onChange={e=>{const v=[...q3Inputs];v[i]=e.target.value;setQ3Inputs(v);}}
                    disabled={q3Done} placeholder="정답 입력"
                    style={{...S.input,margin:0,
                      background:q3Done?(q3Results[i]?"#d4edda":"#f8d7da"):"#ffffff",
                      color:"#111111",borderColor:q3Done?(q3Results[i]?"#2ecc71":"#e74c3c"):"rgba(0,0,0,0.25)"}}/>
                  {q3Done&&(
                    <div style={{marginTop:6,fontSize:13,color:q3Results[i]?"#2ecc71":"#e74c3c"}}>
                      {q3Results[i]?"✅ 정답!":`❌ 정답: ${item.display}`}
                    </div>
                  )}
                </div>
              ))}
            </div>
            {!q3Done
              ?<button onClick={checkQ3} disabled={q3Saving}
                  style={{...S.btn,marginTop:20,opacity:q3Saving?0.6:1}}>
                  {q3Saving?"⏳ 저장 중...":"✅ 제출하기"}
                </button>
              :(
                <div style={{marginTop:20}}>
                  <div style={{...S.scoreBox,borderColor:"#f1c40f"}}>
                    <div style={{color:"#f1c40f",fontSize:36,fontWeight:900}}>{q3Score}점</div>
                    <div style={{color:"#aaa",fontSize:14,marginTop:4}}>
                      {q3Score>=99?"🎉 만점!":q3Score===0?"다시 확인해보세요":`${Math.round(q3Score/33)}개 정답`}
                    </div>
                  </div>
                  <div style={{...S.scoreBox,borderColor:"#9b59b6",marginTop:12}}>
                    <div style={{color:"#9b59b6",fontSize:13,marginBottom:4}}>📊 Q2 + Q3 합산</div>
                    <div style={{color:"#fff",fontSize:30,fontWeight:900}}>{q2Score+q3Score}점</div>
                  </div>
                  <LeaderboardMini
                    scores={allData.scores.length>0?allData.scores:lsGet("friction_scores_v2")}
                    myClass={classNum} myKey={studentKey}/>
                  <button onClick={()=>setMode("home")}
                    style={{...S.btn,marginTop:14,background:"rgba(255,255,255,0.07)",
                      border:"1px solid rgba(255,255,255,0.12)"}}>
                    🏠 처음으로
                  </button>
                </div>
              )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Styles ────────────────────────────────────────────────────────
const S={

    background:"rgba(255,255,255,0.03)",borderRadius:20,border:"1px solid rgba(255,255,255,0.08)"},

    color:"#e74c3c",fontSize:13,fontWeight:600,marginBottom:12},

  input:{width:"100%",padding:"10px 14px",borderRadius:10,

    color:"#fff",fontFamily:"'Noto Sans KR',sans-serif",fontSize:14,
    outline:"none",boxSizing:"border-box"},
  btn:{width:"100%",padding:"12px 0",borderRadius:12,border:"none",cursor:"pointer",
    background:"linear-gradient(135deg,#e74c3c,#c0392b)",color:"#fff",
    fontFamily:"'Noto Sans KR',sans-serif",fontSize:15,fontWeight:700},
  btnGhost:{width:"100%",padding:"10px 0",borderRadius:12,
    border:"1px solid rgba(255,255,255,0.12)",cursor:"pointer",
    background:"transparent",color:"#888",fontFamily:"'Noto Sans KR',sans-serif",fontSize:14},
  btnSmall:{padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",

  qTitle:{color:"#fff",fontSize:18,margin:"0 0 8px",lineHeight:1.4},

  scoreBox:{textAlign:"center",padding:20,borderRadius:14,
    border:"2px solid",background:"rgba(255,255,255,0.02)"},
  emptyBox:{textAlign:"center",padding:40,color:"#555",

    border:"1px dashed rgba(255,255,255,0.07)"},
};


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
